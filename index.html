<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jordan Tranchina</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/icon-logo-dark.svg">
  <link rel="stylesheet" href="fonts/fonts.css">

  <style>
    /* authentic ryo.lu variable extraction */
    :root {
      --large-font-size: 8vw;
      --small-font-size: 1.33333vw;
      /* Using our local font names */
      --header-font-family: "nbintl", "Inter", sans-serif;
      --body-font-family: "nbintl-mono", monospace;
    }

    body {
      margin: 0;
      padding: 0;
      /* Base styles from reference */
      background: #fff;
      color: #111;
      font-family: var(--body-font-family);
      font-size: 2vw;
      /* fallback/base */
      line-height: 1.35em;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    /* .big class replication */
    .big {
      font-family: var(--header-font-family);
      font-size: var(--large-font-size);
      line-height: 1.3em;
      letter-spacing: -0.015em;
      font-weight: 500;
    }

    /* .small class replication */
    .small {
      font-size: var(--small-font-size);
      line-height: 1.2em;
      letter-spacing: 0.05em;
    }

    /* Media queries for .small scaling limits */
    @media (min-width: 1440px) {
      .small {
        font-size: 16px;
        line-height: 1.3em;
      }
    }

    @media (max-width: 760px) {
      .small {
        font-size: 12px;
        line-height: 1.3em;
      }
    }

    /* Authentic Underline using pseudo-element */
    .underline-custom {
      position: relative;
      white-space: nowrap;
      text-decoration: none !important;
      /* ensure native underline is off */
    }

    .underline-custom:after {
      content: "";
      position: absolute;
      bottom: 0.05em;
      right: 0;
      left: 2px;
      height: 3px;
      background: rgba(0, 0, 0, 0.2);
      z-index: -1;
    }

    /* Underline media queries */
    @media (max-width: 760px) {
      .underline-custom:after {
        height: 1.5px;
      }
    }

    @media (min-width: 1440px) {
      .underline-custom:after {
        height: 4px;
      }
    }

    /* Hover effect for links matching reference */
    a {
      transition: opacity .4s cubic-bezier(.075, .82, .165, 1);
      color: #111;
      border: 0;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.5;
      text-decoration: none;
    }

    /* Layout Utilities */
    .header-container {
      padding: 10vw 10vw 2.5vw;
      max-width: 1510px;
      height: 50vh;
      /* Approximate visual balance */
      display: flex;
      align-items: center;
      margin: 0 auto;
    }

    @media (max-width: 760px) {
      .header-container {
        padding: 5vw;
        height: auto;
        min-height: 40vh;
      }
    }

    .section-container {
      padding: 2vw 10vw 5vw;
      max-width: 1510px;
      margin: 0 auto;
    }

    @media (max-width: 760px) {
      .section-container {
        padding: 0 5vw 5vw;
      }
    }

    /* Footer / Lists */
    footer {
      text-transform: uppercase;
      display: flex;
      flex-direction: row;
      line-height: 1.5em;
    }

    @media (max-width: 480px) {
      footer {
        flex-direction: column;
      }

      footer>div {
        margin-bottom: 1em;
      }
    }

    footer>div {
      flex: 1 1;
    }

    .v-list {
      list-style-type: none;
      padding-left: 0;
      margin-top: 0;
    }

    .h-list {
      display: flex;
      list-style-type: none;
      padding-left: 0;
    }

    .h-list li {
      margin-left: 0;
      margin-right: 1.2vw;
    }

    @media (max-width: 480px) {
      .h-list li {
        margin-right: 2vw;
      }
    }

    .no-margins {
      margin: 0;
    }

    /* Utility for border-bottom style links in footer (matches ryo.lu) */
    .border-link {
      position: relative;
      text-decoration: none;
      white-space: nowrap;
    }

    .border-link:after {
      content: "";
      position: absolute;
      bottom: -0.1em;
      right: 0;
      left: 0;
      height: 1px;
      background: var(--border-color);
      z-index: -1;
      opacity: 0.4;
    }

    .border-link:hover:after {
      opacity: 0.7;
    }

    /* Dark Mode Logic: System or Class based */
    :root {
      --bg-color: #fff;
      --text-color: #111;
      --link-color: #111;
      --underline-color: rgba(0, 0, 0, 0.2);
      --border-color: #111;
      --zinc-800: #27272a;
      --zinc-500: #71717a;
    }

    /* System Dark Preference */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #111;
        --text-color: #f0f0f0;
        --link-color: #f0f0f0;
        --underline-color: hsla(0, 0%, 100%, .4);
        --border-color: #fff;
        --zinc-800: #d4d4d8;
        --zinc-500: #a1a1aa;
      }
    }

    /* Manual Overrides */
    html.dark {
      --bg-color: #111 !important;
      --text-color: #f0f0f0 !important;
      --link-color: #f0f0f0 !important;
      --underline-color: hsla(0, 0%, 100%, .4) !important;
      --border-color: #fff !important;
      --zinc-800: #d4d4d8 !important;
      --zinc-500: #a1a1aa !important;
    }

    html.light {
      --bg-color: #fff !important;
      --text-color: #111 !important;
      --link-color: #111 !important;
      --underline-color: rgba(0, 0, 0, 0.2) !important;
      --border-color: #111 !important;
      --zinc-800: #27272a !important;
      --zinc-500: #71717a !important;
    }

    body,
    html {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s ease, color 0.3s ease;
    }

    a,
    a:hover {
      color: var(--link-color);
    }

    .underline-custom:after {
      background: var(--underline-color);
    }

    .border-link:after {
      background: var(--border-color);
    }

    /* Helper classes mapped to variables */
    .text-zinc-800 {
      color: var(--zinc-800);
    }

    .text-zinc-500 {
      color: var(--zinc-500);
    }

    .border-black {
      border-color: var(--border-color);
    }

    /* Toggle Button Style */
    .theme-toggle {
      cursor: pointer;
      user-select: none;
    }

    .theme-toggle:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body class="flex flex-col h-screen overflow-hidden justify-between">

  <noscript>You need to enable JavaScript to run this app.</noscript>

  <div id="root" class="flex flex-col h-full w-full justify-between">

    <!-- Big Header -->
    <header class="header-container big flex-grow">
      <span>
        <span>Jordan is making <a class="underline-custom" href="https://www.gusto.com" target="_blank" rel="noopener noreferrer">Gusto</a>.</span>
      </span>
    </header>

    <!-- Small Section -->
    <section class="section-container small w-full space-y-8">

      <!-- Last Seen Status -->
      <p class="last-seen" style="text-transform: uppercase; margin-bottom: 2em;">
        <span>AUSTIN, TX</span>
      </p>

      <!-- Main Footer (Consolidated Left Layout) -->
      <footer>
        <!-- Left Column: About Me + Experience -->
        <div>
          <!-- About Me (Moved above Experience) -->
          <div style="margin-bottom: 2em;">
            <p class="no-margins">
              <a href="about.html" class="border-link"><span>ABOUT ME</span></a>
            </p>
          </div>

          <!-- Experience List -->
          <div>
            <span class="text-zinc-500 block mb-2">EXPERIENCE</span>
            <ul class="v-list">
              <li><span class="border-link cursor-default">EY DESIGN STUDIO (UX DESIGN)</span></li>
              <li><span class="border-link cursor-default">KELLOGG (MBA)</span></li>
              <li><span class="border-link cursor-default">INDIANA UNIVERSITY (FINANCE, ECONOMICS)</span></li>
            </ul>
          </div>
        </div>

        <!-- Right Column: Empty (Spacer) -->
        <div></div>
      </footer>

      <!-- Socials Footer + Theme Toggle -->
      <footer style="margin-top: 1em;">
        <div>
          <ul class="h-list contact">
            <li>
              <a href="https://www.linkedin.com/in/jordantranchina/" target="_blank" rel="noopener noreferrer"
                class="border-link flex items-center gap-1">
                <span>LINKEDIN</span>
              </a>
            </li>
            <li>
              <a href="https://cal.com/" target="_blank" rel="noopener noreferrer" class="border-link flex items-center gap-1">
                <span>SCHEDULE</span>
              </a>
            </li>
            <li>
              <a href="mailto:Jordan12522@gmail.com" class="border-link flex items-center gap-1">
                <span>EMAIL</span>
              </a>
            </li>
            <!-- Theme Toggle -->
            <li>
              <span class="theme-toggle" id="themeToggle">THEME</span>
            </li>
          </ul>
        </div>
      </footer>

    </section>
  </div>

  <script>
    // Theme Toggle Logic
    const toggleBtn = document.getElementById('themeToggle');
    const html = document.documentElement;

    // Check local storage or system preference
    const savedTheme = localStorage.getItem('theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
      html.classList.add('dark');
      html.classList.remove('light');
    } else {
      html.classList.add('light'); // Explicitly set light if saved 'light' or system light
      html.classList.remove('dark');
    }

    toggleBtn.addEventListener('click', () => {
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
</body>

</html>
