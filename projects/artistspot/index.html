<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artistspot</title>
<meta name="description" content="Guess the song in 0.1 seconds, for one artist.">
<style>
  :root {
    --bg: #0e0f13; --panel: #171920; --panel-2: #1f222b; --line: #2b2f3a;
    --text: #eceef3; --muted: #9097a6; --accent: #7cf29c; --accent-ink: #0b1a10;
    --bad: #ff6b6b; --warn: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .logo { font-weight: 800; letter-spacing: .5px; font-size: 20px; }
  .logo b { color: var(--accent); }
  .streak { color: var(--muted); font-size: 13px; text-align: right; }
  .streak strong { color: var(--text); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  label.small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px; }
  .field { position: relative; }
  input[type=text] { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: none; max-height: 300px; overflow-y: auto; }
  .sugg.open { display: block; }
  .sugg button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
    padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .sugg button:last-child { border-bottom: 0; }
  .sugg button:hover, .sugg button.active { background: #2a2e39; }
  .sugg img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex: none; }
  .sugg .sub { color: var(--muted); font-size: 12px; }
  .artist-now { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .artist-now img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .artist-now .name { font-weight: 700; }
  .artist-now .sub { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
  .seg button.on { background: var(--text); color: var(--bg); font-weight: 600; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .spacer { flex: 1; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 16px; }
  .stage { text-align: center; padding: 8px 0; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage.past { background: #3a2226; border-color: #5a2b31; color: #ffb3b3; text-decoration: line-through; }
  .stage.now { border-color: var(--accent); color: var(--text); font-weight: 700; }
  .stage.win { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .play { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; }
  .playbtn { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 6px 30px rgba(124,242,156,.25); transition: transform .12s; }
  .playbtn:active { transform: scale(.95); }
  .playbtn:disabled { opacity: .4; cursor: default; }
  .playbtn svg { width: 34px; height: 34px; margin-left: 4px; }
  .playbtn.playing { animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 0 10px rgba(124,242,156,.15); } }
  .hint { text-align: center; color: var(--muted); font-size: 13px; min-height: 20px; }
  .guesses { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .guesses li { padding: 4px 0; }
  .guesses li::before { content: "✕ "; color: var(--bad); }
  .guesses li.skip::before { content: "↷ "; color: var(--muted); }
  .result { display: none; text-align: center; }
  .result.show { display: block; }
  .result img { width: 160px; height: 160px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .result h2 { margin: 12px 0 2px; font-size: 20px; }
  .result .album { color: var(--muted); font-size: 13px; }
  .result .verdict { margin: 10px 0 14px; font-weight: 700; }
  .result .verdict.win { color: var(--accent); }
  .result .verdict.lose { color: var(--bad); }
  .vol { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .vol input { accent-color: var(--accent); width: 110px; }
  .empty { text-align: center; color: var(--muted); padding: 26px 8px; }
  .err { color: var(--bad); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  footer a { color: var(--muted); }
  @media (max-width: 420px) { .stage { font-size: 12px; } .playbtn { width: 74px; height: 74px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">artist<b>spot</b></div>
    <div class="streak">Streak <strong id="streak">0</strong> · Best <strong id="best">0</strong></div>
  </header>

  <section class="card">
    <label class="small" for="artistInput">Artist</label>
    <div class="field">
      <input type="text" id="artistInput" placeholder="Search an artist…" autocomplete="off">
      <div class="sugg" id="artistSugg"></div>
    </div>
    <div class="artist-now" id="artistNow" hidden>
      <img id="artistImg" alt="">
      <div><div class="name" id="artistName"></div><div class="sub" id="artistSub"></div></div>
    </div>
  </section>

  <section class="card" id="game">
    <div class="empty" id="emptyState">Pick an artist to start guessing their songs.</div>
    <div id="board" hidden>
      <div class="row" style="margin-bottom:14px">
        <div class="seg" id="diffSeg">
          <button data-d="easy">Easy</button><button data-d="medium">Medium</button><button data-d="hard">Hard</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="rerollBtn" title="New song. Free before you guess or skip.">Reroll</button>
      </div>

      <div class="stages" id="stages"></div>

      <div class="play">
        <button class="playbtn" id="playBtn" aria-label="Play clip" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Loading…</div>

      <div id="guessArea" style="margin-top:14px">
        <div class="field">
          <input type="text" id="guessInput" placeholder="Type a song title…" autocomplete="off">
          <div class="sugg" id="guessSugg"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="skipBtn">Skip</button>
          <span class="spacer"></span>
          <div class="vol">🔊 <input type="range" id="vol" min="0" max="1" step="0.05"></div>
        </div>
        <ul class="guesses" id="guesses"></ul>
      </div>

      <div class="result" id="result">
        <img id="resCover" alt="">
        <h2 id="resTitle"></h2>
        <div class="album" id="resAlbum"></div>
        <div class="verdict" id="resVerdict"></div>
        <div class="row" style="justify-content:center">
          <button class="btn" id="fullBtn">▶ Play 30 s</button>
          <button class="btn primary" id="nextBtn">Next song</button>
        </div>
      </div>
    </div>
  </section>

  <footer>Inspired by <a href="https://songspot.net" target="_blank" rel="noopener">songspot.net</a>. Previews and data from Deezer.</footer>
</div>

<script>
(() => {
  const STAGES = [0.1, 0.5, 2, 8, 15];
  const DIFF_SIZE = { easy: 20, medium: 50, hard: Infinity };
  const LS = {
    get(k, d) { try { const v = localStorage.getItem('as_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('as_' + k, JSON.stringify(v)); } catch {} },
  };
  const $ = id => document.getElementById(id);
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\(.*?\)|\[.*?\]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

  // ---------- state ----------
  let artist = null;        // {id, name, picture, nb_fan}
  let tracks = [];          // unique tracks, sorted by popularity (rank)
  let diff = LS.get('diff', 'medium');
  let round = null;         // {track, stage, guesses:[], over, won, touched}
  let audioCtx = null, gain = null, buffer = null, source = null, bufferFor = null, stopTimer = null;
  let streak = LS.get('streak', 0), best = LS.get('best', 0);
  const vol = $('vol'); vol.value = LS.get('vol', 0.7);

  function renderStreak() { $('streak').textContent = streak; $('best').textContent = best; }
  renderStreak();

  // ---------- API ----------
  async function api(params) {
    const r = await fetch('/api/artistspot/deezer?' + new URLSearchParams(params));
    if (!r.ok) throw new Error('Network error');
    return r.json();
  }

  // ---------- artist search ----------
  const artistInput = $('artistInput'), artistSugg = $('artistSugg');
  let artistTimer = null, artistReq = 0;
  artistInput.addEventListener('input', () => {
    clearTimeout(artistTimer);
    const q = artistInput.value.trim();
    if (!q) { artistSugg.classList.remove('open'); return; }
    artistTimer = setTimeout(async () => {
      const my = ++artistReq;
      try {
        const data = await api({ type: 'artists', q });
        if (my !== artistReq) return;
        showArtistSugg(data.data || []);
      } catch { /* ignore */ }
    }, 250);
  });
  function showArtistSugg(list) {
    artistSugg.replaceChildren();
    if (!list.length) { artistSugg.classList.remove('open'); return; }
    for (const a of list) {
      const b = document.createElement('button');
      const img = document.createElement('img'); img.src = a.picture_small || ''; img.alt = '';
      const t = document.createElement('div');
      const n = document.createElement('div'); n.textContent = a.name;
      const s = document.createElement('div'); s.className = 'sub'; s.textContent = fmtFans(a.nb_fan);
      t.append(n, s); b.append(img, t);
      b.onclick = () => { artistSugg.classList.remove('open'); artistInput.value = ''; chooseArtist(a); };
      artistSugg.append(b);
    }
    artistSugg.classList.add('open');
  }
  const fmtFans = n => n ? Intl.NumberFormat('en', { notation: 'compact' }).format(n) + ' fans' : '';

  async function chooseArtist(a, keepUrl) {
    artist = { id: a.id, name: a.name, picture: a.picture_medium || a.picture || '', nb_fan: a.nb_fan };
    LS.set('artist', artist);
    if (!keepUrl) history.replaceState(null, '', '?artist=' + a.id);
    $('artistNow').hidden = false;
    $('artistImg').src = artist.picture;
    $('artistName').textContent = artist.name;
    $('artistSub').textContent = 'Loading songs…';
    $('emptyState').hidden = true; $('board').hidden = false;
    try {
      const data = await api({ type: 'top', id: a.id });
      const seen = new Set(); tracks = [];
      for (const t of (data.data || [])) {
        if (!t.preview || t.readable === false) continue;
        const key = norm(t.title_short || t.title);
        if (!key || seen.has(key)) continue;
        seen.add(key); tracks.push(t);
      }
      tracks.sort((x, y) => (y.rank || 0) - (x.rank || 0));
      if (!artist.name && tracks[0]) { artist.name = tracks[0].artist.name; $('artistName').textContent = artist.name; }
      $('artistSub').textContent = tracks.length + ' songs' + (artist.nb_fan ? ' · ' + fmtFans(artist.nb_fan) : '');
      if (tracks.length < 2) { $('hint').innerHTML = '<span class="err">Not enough songs with previews for this artist.</span>'; return; }
      newRound();
    } catch {
      $('artistSub').textContent = '';
      $('hint').innerHTML = '<span class="err">Could not load songs. Try again.</span>';
    }
  }

  // ---------- song choice: unseen first, then unsolved oldest ----------
  function pool() { return tracks.slice(0, Math.min(tracks.length, DIFF_SIZE[diff])); }
  function pickTrack() {
    const p = pool();
    const hist = LS.get('hist_' + artist.id, { seen: {}, solved: {} });
    let cands = p.filter(t => !hist.seen[t.id]);
    if (!cands.length) {
      cands = p.filter(t => !hist.solved[t.id]).sort((a, b) => hist.seen[a.id] - hist.seen[b.id]).slice(0, 5);
    }
    if (!cands.length) { // solved the whole pool: start a new cycle
      for (const t of p) { delete hist.seen[t.id]; delete hist.solved[t.id]; }
      LS.set('hist_' + artist.id, hist);
      cands = p;
    }
    if (round && cands.length > 1) cands = cands.filter(t => t.id !== round.track.id);
    return cands[Math.floor(Math.random() * cands.length)];
  }
  function markHist(t, solved) {
    const hist = LS.get('hist_' + artist.id, { seen: {}, solved: {} });
    hist.seen[t.id] = Date.now();
    if (solved) hist.solved[t.id] = Date.now();
    LS.set('hist_' + artist.id, hist);
  }

  // ---------- round ----------
  function newRound() {
    stopAudio();
    const track = pickTrack();
    round = { track, stage: 0, guesses: [], over: false, won: false, touched: false };
    markHist(track, false);
    $('result').classList.remove('show');
    $('guessArea').hidden = false;
    $('guessInput').value = ''; $('guessSugg').classList.remove('open');
    $('guesses').replaceChildren();
    renderStages(); loadAudio(track);
  }

  function renderStages() {
    const el = $('stages'); el.replaceChildren();
    STAGES.forEach((s, i) => {
      const d = document.createElement('div'); d.className = 'stage'; d.textContent = s + 's';
      if (round.won && i === round.stage) d.classList.add('win');
      else if (i < round.stage || (round.over && !round.won)) d.classList.add('past');
      else if (i === round.stage && !round.over) d.classList.add('now');
      el.append(d);
    });
    $('skipBtn').textContent = round.stage === STAGES.length - 1 ? 'Give up' : 'Skip (+' + (STAGES[round.stage + 1] - STAGES[round.stage]).toFixed(1).replace(/\.0$/, '') + 's)';
    if (!round.over && buffer) $('hint').textContent = 'Press play to hear ' + STAGES[round.stage] + ' s';
  }

  // ---------- audio (Web Audio for exact clip lengths) ----------
  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gain = audioCtx.createGain(); gain.connect(audioCtx.destination);
    }
    gain.gain.value = +vol.value;
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  async function loadAudio(track) {
    buffer = null; bufferFor = track.id;
    $('playBtn').disabled = true; $('hint').textContent = 'Loading song…';
    try {
      const r = await fetch('/api/artistspot/audio?u=' + encodeURIComponent(track.preview));
      if (!r.ok) throw 0;
      const ab = await r.arrayBuffer();
      const ctx = audioCtx || new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, 44100, 44100);
      const buf = await ctx.decodeAudioData(ab);
      if (bufferFor !== track.id) return;
      buffer = buf;
      $('playBtn').disabled = false;
      renderStages();
    } catch {
      if (bufferFor !== track.id) return;
      $('hint').innerHTML = '<span class="err">Could not load this song.</span> Press Reroll.';
      round.touched = false; // a broken song never costs a streak
    }
  }
  function playClip(seconds) {
    if (!buffer) return;
    ensureCtx(); stopAudio();
    source = audioCtx.createBufferSource(); source.buffer = buffer; source.connect(gain);
    const dur = Math.min(seconds, buffer.duration);
    source.start(0, 0, dur);
    $('playBtn').classList.add('playing');
    stopTimer = setTimeout(() => $('playBtn').classList.remove('playing'), dur * 1000 + 60);
  }
  function stopAudio() {
    clearTimeout(stopTimer); $('playBtn').classList.remove('playing');
    if (source) { try { source.stop(); } catch {} source = null; }
  }
  $('playBtn').onclick = () => playClip(round.over ? 30 : STAGES[round.stage]);
  vol.oninput = () => { LS.set('vol', +vol.value); if (gain) gain.gain.value = +vol.value; };

  // ---------- guessing ----------
  const guessInput = $('guessInput'), guessSugg = $('guessSugg');
  let active = -1;
  guessInput.addEventListener('input', showGuessSugg);
  guessInput.addEventListener('focus', showGuessSugg);
  guessInput.addEventListener('keydown', e => {
    const items = [...guessSugg.querySelectorAll('button')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((b, i) => b.classList.toggle('active', i === active));
    } else if (e.key === 'Enter') {
      e.preventDefault(); (items[active] || items[0])?.click();
    } else if (e.key === 'Escape') { guessSugg.classList.remove('open'); }
  });
  function showGuessSugg() {
    const q = norm(guessInput.value);
    guessSugg.replaceChildren(); active = -1;
    if (!q || !round || round.over) { guessSugg.classList.remove('open'); return; }
    const words = q.split(' ');
    const list = tracks.filter(t => { const n = norm(t.title_short || t.title); return words.every(w => n.includes(w)); })
      .sort((a, b) => norm(a.title_short).startsWith(q) ? -1 : norm(b.title_short).startsWith(q) ? 1 : 0).slice(0, 8);
    if (!list.length) { guessSugg.classList.remove('open'); return; }
    for (const t of list) {
      const b = document.createElement('button');
      const d = document.createElement('div');
      const n = document.createElement('div'); n.textContent = t.title_short || t.title;
      const s = document.createElement('div'); s.className = 'sub'; s.textContent = t.album?.title || '';
      d.append(n, s); b.append(d);
      b.onclick = () => guess(t);
      guessSugg.append(b);
    }
    guessSugg.classList.add('open');
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.field')) { guessSugg.classList.remove('open'); artistSugg.classList.remove('open'); }
  });

  function guess(t) {
    if (!round || round.over) return;
    round.touched = true;
    guessSugg.classList.remove('open'); guessInput.value = '';
    if (t.id === round.track.id || norm(t.title_short) === norm(round.track.title_short)) return finish(true);
    addGuess(t.title_short || t.title, false);
    advance();
  }
  $('skipBtn').onclick = () => {
    if (!round || round.over) return;
    round.touched = true;
    addGuess('Skipped', true);
    advance();
  };
  function addGuess(text, skip) {
    const li = document.createElement('li'); li.textContent = text; if (skip) li.className = 'skip';
    $('guesses').append(li);
  }
  function advance() {
    if (round.stage >= STAGES.length - 1) return finish(false);
    round.stage++; renderStages();
    playClip(STAGES[round.stage]);
  }
  function finish(won) {
    round.over = true; round.won = won; stopAudio();
    if (won) { streak++; best = Math.max(best, streak); markHist(round.track, true); }
    else streak = 0;
    LS.set('streak', streak); LS.set('best', best); renderStreak();
    renderStages();
    const t = round.track;
    $('guessArea').hidden = true;
    $('resCover').src = t.album?.cover_big || t.album?.cover_medium || '';
    $('resTitle').textContent = t.title_short || t.title;
    $('resAlbum').textContent = t.album?.title || '';
    const v = $('resVerdict');
    v.className = 'verdict ' + (won ? 'win' : 'lose');
    v.textContent = won ? 'Got it in ' + STAGES[round.stage] + ' s!' : 'Missed it';
    $('hint').textContent = '';
    $('result').classList.add('show');
  }
  $('fullBtn').onclick = () => playClip(30);
  $('nextBtn').onclick = newRound;

  // Reroll is free before you guess or skip. After that it counts as a loss.
  $('rerollBtn').onclick = () => {
    if (!tracks.length) return;
    if (round && round.touched && !round.over) { streak = 0; LS.set('streak', 0); renderStreak(); }
    newRound();
  };

  // ---------- difficulty ----------
  function renderDiff() { document.querySelectorAll('#diffSeg button').forEach(b => b.classList.toggle('on', b.dataset.d === diff)); }
  document.querySelectorAll('#diffSeg button').forEach(b => b.onclick = () => {
    if (b.dataset.d === diff) return;
    diff = b.dataset.d; LS.set('diff', diff); renderDiff();
    if (tracks.length && (!round || !round.touched || round.over)) newRound();
  });
  renderDiff();

  // ---------- start ----------
  const urlId = new URLSearchParams(location.search).get('artist');
  const saved = LS.get('artist', null);
  if (urlId && /^\d+$/.test(urlId)) chooseArtist(saved && String(saved.id) === urlId ? saved : { id: +urlId, name: '' }, true);
  else if (saved) chooseArtist(saved);
})();
</script>
</body>
</html>
